services:
  postgres_olist:
    image: postgres:16
    container_name: postgres_olist_sql
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_olist_data:/var/lib/postgresql/data

volumes:
  postgres_olist_data: